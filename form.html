<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main class="main__container">
        <form id="reviewForm">
            <label for="product">Product Name:</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <input type="radio" id="star1" name="rating" value="1" required />
                <label for="star1">&star;</label>
                <input type="radio" id="star2" name="rating" value="2" required />
                <label for="star2">&star;&star;</label>
                <input type="radio" id="star3" name="rating" value="3" required />
                <label for="star3">&star;&star;&star;</label>
                <input type="radio" id="star4" name="rating" value="4" required />
                <label for="star4">&star;&star;&star;&star;</label>
                <input type="radio" id="star5" name="rating" value="5" required />
                <label for="star5">&star;&star;&star;&star;&star;</label>
            </fieldset>

            <label for="date">Date of Installation:</label>
            <input type="date" id="date" name="date" required />

            <fieldset>
                <legend>Which of these features did you find useful?<br />(Check all that apply)</legend>
                <div>
                    <input type="checkbox" id="feature1" name="features" value="Durability" />
                    <label for="feature1">Durability</label>
                </div>
                <div>
                    <input type="checkbox" id="feature2" name="features" value="Ease of Use" />
                    <label for="feature2">Ease of Use</label>
                </div>
                <div>
                    <input type="checkbox" id="feature3" name="features" value="Performance" />
                    <label for="feature3">Performance</label>
                </div>
                <div>
                    <input type="checkbox" id="feature4" name="features" value="Design" />
                    <label for="feature4">Design</label>
                </div>
            </fieldset>

            <label for="review">Written Review (<span>Optional</span>)</label>
            <textarea rows="6" id="review" name="review"></textarea>

            <label for="username">User Name (<span>Optional</span>)</label>
            <input type="text" id="username" name="username" />

            <input type="submit" value="Post Review" />
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear">2024</span> Timothy Karikari &hearts; Accra, Ghana</p>
        <p id="lastModified">Last Modified: <span></span></p>
    </footer>
    <script src="scripts/script.js"></script>
    <script>
        document.getElementById("reviewForm").addEventListener("submit", (e) => {
            e.preventDefault(); // Prevent form from submitting the traditional way

            // Redirect to review.html after form submission
            window.location.href = "review.html";
        });
    </script>
</body>
</html>
